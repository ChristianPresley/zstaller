name: Release

# Verifies and publishes a draft release whose installers were built and
# uploaded locally by scripts/release.ps1. GitHub never builds the files a
# release ships: this workflow checks their checksums, installs, runs and
# uninstalls the exact files on every supported platform, then publishes
# the draft. scripts/release.ps1 -Tag starts it; to rerun it, use "Run
# workflow" on the Actions tab with the draft's tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to verify and publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  fetch:
    name: Fetch uploaded installers
    runs-on: ubuntu-latest
    permissions:
      contents: write # reading draft releases needs write access
    outputs:
      commit: ${{ steps.download.outputs.commit }}
    steps:
      - name: Download the draft release's files
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then
            echo "$TAG is not a draft release; upload it with scripts/release.ps1 -Tag $TAG"
            exit 1
          fi
          # Test with the scripts from the commit the files were built from.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish             --jq '"commit=" + .targetCommitish' >>"$GITHUB_OUTPUT"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir installers
          cd installers && sha256sum --check *.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: release-installers
          path: installers/
          if-no-files-found: error

  verify-linux:
    name: Verify (${{ matrix.os }})
    needs: fetch
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.fetch.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: release-installers
          path: installers
      - name: Install, run and remove the .deb
        run: examples/sample/scripts/test-linux.sh "$PWD/installers"

  verify-windows:
    name: Verify (${{ matrix.os }})
    needs: fetch
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.fetch.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: release-installers
          path: installers
      - name: Install, run and uninstall the MSI and EXE
        shell: pwsh
        run: examples/sample/scripts/test-windows.ps1 -InstallerDir "$PWD/installers"

  publish:
    name: Publish release
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
