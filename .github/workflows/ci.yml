name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install package verification tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y msitools

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples

      - name: Build and test
        run: zig build test --summary all

  sample-linux:
    name: Sample end-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The arm64 runner installs and runs the arm64 .deb natively.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build installers, verify and install the .deb
        run: examples/sample/scripts/test-linux.sh

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: sample-installers
          path: examples/sample/zig-out/installers/
          if-no-files-found: error

  sample-windows:
    name: Sample end-to-end (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build installers, silent MSI and EXE install/uninstall
        shell: pwsh
        run: examples/sample/scripts/test-windows.ps1

      - name: Upload msiexec logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msiexec-logs-windows-latest
          path: examples/sample/zig-out/installers/*.log
          if-no-files-found: ignore

  # Builds the sample twice from copies of the repository at different
  # paths with separate caches and requires identical installers, then
  # checks that SOURCE_DATE_EPOCH changes invalidate the cache.
  reproducible:
    name: Reproducible build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build twice and compare
        shell: bash
        run: examples/sample/scripts/test-reproducible.sh "$RUNNER_TEMP/SHA256SUMS"

      - uses: actions/upload-artifact@v7
        with:
          name: reproducible-sums-${{ matrix.os }}
          path: ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

  # Linux and Windows hosts must produce the same installers.
  reproducible-across-hosts:
    name: Reproducible across hosts
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reproducible-sums-*
      - name: Compare Linux and Windows builds
        run: diff reproducible-sums-ubuntu-latest/SHA256SUMS reproducible-sums-windows-latest/SHA256SUMS

  # Installs, runs and uninstalls the aarch64 MSI and EXE natively. The
  # installers come from the Ubuntu job (cross-compiled, as zstaller is
  # meant to be used), so this runner does not need Zig.
  sample-windows-arm:
    name: Sample end-to-end (windows-11-arm)
    needs: sample-linux
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: sample-installers
          path: installers

      - name: Silent MSI and EXE install/uninstall
        shell: pwsh
        run: examples/sample/scripts/test-windows.ps1 -InstallerDir "$PWD/installers"

      - name: Upload msiexec logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msiexec-logs-windows-11-arm
          path: installers/*.log
          if-no-files-found: ignore
