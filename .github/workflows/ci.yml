name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install package verification tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y msitools

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples

      - name: Build and test
        run: zig build test --summary all

  sample-linux:
    name: Sample end-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The arm64 runner installs and runs the arm64 .deb natively.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build installers, verify and install the .deb
        run: examples/sample/scripts/test-linux.sh

      - name: DIAG build aarch64-windows hellos
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir diag && cd diag
          for m in Debug ReleaseSafe ReleaseSmall; do for f in hello hello_init; do
            zig build-exe ../.github/diag/$f.zig -target aarch64-windows-gnu -O $m --name $f-$m-gnu
            zig build-exe ../.github/diag/$f.zig -target aarch64-windows-msvc -O $m --name $f-$m-msvc || true
          done; done
          zig build-exe ../.github/diag/hello.zig -target x86_64-windows-gnu -O ReleaseSafe --name hello-x64
          ls

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: diag
          path: diag/*.exe

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: sample-installers
          path: examples/sample/zig-out/installers/
          if-no-files-found: error

  sample-windows:
    name: Sample end-to-end (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build installers, silent MSI and EXE install/uninstall
        shell: pwsh
        run: examples/sample/scripts/test-windows.ps1

      - name: Upload msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msiexec-logs-windows-latest
          path: examples/sample/zig-out/installers/*.log
          if-no-files-found: ignore

  # Installs, runs and uninstalls the aarch64 MSI and EXE natively. The
  # installers come from the Ubuntu job (cross-compiled, as zstaller is
  # meant to be used), so this runner does not need Zig.
  sample-windows-arm:
    name: Sample end-to-end (windows-11-arm)
    needs: sample-linux
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: sample-installers
          path: installers

      - uses: actions/download-artifact@v4
        with:
          name: diag
          path: diag

      - name: DIAG run hellos
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ComputerInfo -Property OsName,OsVersion,OsArchitecture | Out-String
          foreach ($e in Get-ChildItem diag/*.exe) {
            $out = & $e.FullName 2>&1 | Out-String
            Write-Host ("{0}: exit 0x{1:X8} output: {2}" -f $e.Name, $LASTEXITCODE, $out.Trim())
          }

      - name: Silent MSI and EXE install/uninstall
        shell: pwsh
        run: examples/sample/scripts/test-windows.ps1 -InstallerDir "$PWD/installers"

      - name: Upload msiexec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msiexec-logs-windows-11-arm
          path: installers/*.log
          if-no-files-found: ignore
